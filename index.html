<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>シフト希望</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171F32" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700&display=swap">
<style>
/* Layout: 紙のシフト希望表をスマホに置き換えた一画面アプリ。上に月の切り替え、下にタブ、中身は1カラム */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#18213A; --muted:#5A6582; --line:#DAE0EB; --line-strong:#B9C2D6;
  --accent:#2C52CF; --accent-ink:#FFFFFF; --accent-soft:#E5EBFC;
  --ok:#137F4A; --ok-soft:#DCF2E5; --part:#A86200; --part-soft:#FBEED3; --ng:#BE3446; --ng-soft:#FAE2E5;
  --sat:#2D66CF; --sun:#C63447; --shadow:0 6px 24px rgba(24,33,58,.14);
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1321; --surface:#171F32; --ink:#E6EBF6; --muted:#98A4C0; --line:#28324B; --line-strong:#3A4766;
  --accent:#7D9BFF; --accent-ink:#0E1321; --accent-soft:#212E57;
  --ok:#4CC78A; --ok-soft:#163828; --part:#EFAE48; --part-soft:#3D2F17; --ng:#F07384; --ng-soft:#45202A;
  --sat:#83A8FF; --sun:#FF8797; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1321; --surface:#171F32; --ink:#E6EBF6; --muted:#98A4C0; --line:#28324B; --line-strong:#3A4766;
  --accent:#7D9BFF; --accent-ink:#0E1321; --accent-soft:#212E57;
  --ok:#4CC78A; --ok-soft:#163828; --part:#EFAE48; --part-soft:#3D2F17; --ng:#F07384; --ng-soft:#45202A;
  --sat:#83A8FF; --sun:#FF8797; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:15px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.storebar{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.storebar .chip{padding:7px 14px;font-size:14px;font-weight:700;white-space:nowrap;flex:none}
.monthsw{display:flex;align-items:center;gap:4px}
.monthsw b{font-family:var(--f-display);font-size:18px;min-width:6.6em;text-align:center}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1;flex:none}
.icon-btn.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(92px + env(safe-area-inset-bottom,0px))}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{display:flex;gap:4px;width:100%;max-width:520px}
.tab{flex:1;border:0;background:none;border-radius:10px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12px}
.tab .g{font-family:var(--f-display);font-size:19px;line-height:1.2}
.tab[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
h2{font-family:var(--f-display);font-size:17px;margin:0;text-wrap:balance}
h3{font-size:14px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.04em}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.banner{border:1px solid var(--ng);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--ng);background:var(--ng-soft);display:flex;gap:8px;align-items:center;justify-content:space-between}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%;padding:13px;font-size:16px}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn:disabled{opacity:.6}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em}
input[type=text],select,textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:9px 11px;width:100%;min-width:0;font-size:16px}
textarea{resize:vertical;min-height:70px}
.urlbox{font-size:12px;word-break:break-all;background:var(--bg);border-radius:8px;padding:8px 10px}

/* 状態記号 ○ × は紙の希望表と同じ字形で見せる（○＝勤務可能時間） */
.sym{font-family:var(--f-display);font-weight:700}
.s-o{color:var(--ok)} .s-p{color:var(--ok)} .s-x{color:var(--ng)}

.brushes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.brush{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;color:var(--muted)}
.brush .sym{font-size:22px;line-height:1.2}
.brush[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wd{text-align:center;font-size:12px;color:var(--muted);font-weight:700}
.cal .wd.sun,.cell.sun .dn{color:var(--sun)} .cal .wd.sat,.cell.sat .dn{color:var(--sat)}
.cell{min-height:56px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;min-width:0;overflow:hidden}
button.cell{cursor:pointer}
.cell .dn{font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
.cell .big{font-family:var(--f-display);font-size:21px;line-height:1.15}
.cell .tiny{font-size:10px;line-height:1.25;color:var(--muted);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.cell.o{background:var(--ok-soft);border-color:transparent}
.cell.p{background:var(--ok-soft);border-color:transparent}
.cell.x{background:var(--ng-soft);border-color:transparent}
.cell.short{background:var(--ng-soft);border-color:transparent}
.cell.half{background:var(--part-soft);border-color:transparent}
.cell.full{background:var(--ok-soft);border-color:transparent}
.cell.sel{outline:2.5px solid var(--accent);outline-offset:-1px}
.blank{min-height:0;border:0}

.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px;background:var(--surface)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on .sym{color:inherit}
.chip .t{font-size:11px;color:var(--muted)} .chip.on .t{color:inherit;opacity:.85}

.cand{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.cand button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 9px;display:flex;flex-direction:column;gap:0;min-width:0}
.cand button .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand button .meta{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cand button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.cand button.dim{opacity:.55}

.slot{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.slot:first-of-type{border-top:0;padding-top:0}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}
.stepper button{border:0;background:none;width:34px;height:32px;font-size:16px}
.stepper span{min-width:3.4em;text-align:center;font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.short{background:var(--ng-soft);color:var(--ng)} .pill.half{background:var(--part-soft);color:var(--part)}

/* 時間軸：開店〜閉店を30分ごとのマスで並べる */
.tl{display:grid;grid-template-columns:repeat(var(--n,24),minmax(0,1fr));gap:1px;width:100%}
.tl span{height:10px;background:var(--line);border-radius:2px}
.tl span.av{background:var(--ok-soft)} .tl span.pv{background:var(--part-soft)}
.tl span.as{background:var(--accent)} .tl span.as.warn{background:var(--ng)}
.tl-head span,.tl-cov span{background:none;height:auto;font-size:10px;line-height:1.5;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-head span{overflow:visible;white-space:nowrap}
.tl-cov span{text-align:center;border-radius:3px}
.tl-cov span.ok{background:var(--ok-soft);color:var(--ok)} .tl-cov span.ng{background:var(--ng-soft);color:var(--ng);font-weight:700}
.slist{display:flex;flex-direction:column;gap:6px}
.srow{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;width:100%}
.srow.on{border-color:var(--accent)}
.srow.dim{opacity:.6}
.srow-top{display:flex;justify-content:space-between;gap:8px;min-width:0}
.srow .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .tm{font-weight:700;color:var(--accent);white-space:nowrap}
.srow .meta{font-size:11px;color:var(--muted)}
.tilde{padding-top:20px;color:var(--muted)}

.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:10px}
table.mx{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:4px 0;text-align:center;min-width:28px;background:var(--surface)}
.mx th:first-child,.mx td:first-child{position:sticky;left:0;z-index:1;text-align:left;padding:4px 8px;min-width:6.5em;max-width:8em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.mx thead th{font-weight:400;color:var(--muted);line-height:1.2}
.mx .sun{color:var(--sun)} .mx .sat{color:var(--sat)}
.mx td .sym{font-size:14px}
.mx tr.total td{font-weight:700;background:var(--bg)}

/* 週の表：Excelのシフト表と同じく 名前×月〜日。マスは上に時間、下に持ち場 */
.wk{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums;width:100%}
.wk th,.wk td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;background:var(--surface);vertical-align:middle}
.wk th:first-child,.wk td:first-child{position:sticky;left:0;z-index:1;text-align:left;padding:4px 8px;min-width:5.6em;max-width:7em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.wk thead th{font-weight:400;line-height:1.25}
.wk .wh{display:flex;flex-direction:column;align-items:center;width:100%;border:0;background:none;padding:4px 2px;line-height:1.25}
.wk .wh .c{font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;margin-top:2px}
.wk .wh .c.full{background:var(--ok-soft);color:var(--ok)} .wk .wh .c.half{background:var(--part-soft);color:var(--part)} .wk .wh .c.short{background:var(--ng-soft);color:var(--ng)}
.wk .sun{color:var(--sun)} .wk .sat{color:var(--sat)}
.wk .wc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:62px;min-height:44px;border:0;background:none;padding:3px 2px;line-height:1.25;gap:1px}
.wk td.as{background:var(--accent-soft)} .wk td.as .t{font-weight:700;color:var(--accent)}
.wk td.as.warn{box-shadow:inset 0 0 0 2px var(--ng)}
.wk td.as.help{background:var(--surface);outline:2px dashed var(--accent);outline-offset:-3px}
.wk .from{display:block;font-size:10px;color:var(--muted);font-weight:400}
.wk td.av{background:var(--ok-soft)} .wk td.av .t{color:var(--ok);font-size:11px}
.wk td.x{background:var(--bg)} .wk td.x .t{color:var(--ng)}
.wk td.out{background:var(--bg);opacity:.55}
.wk .t,.wk .r{white-space:nowrap} .wk .r{font-size:11px;color:var(--ink)} .wk .bk{font-size:10px;color:var(--muted);font-weight:400}
.wk .tot,.wk tr.total td{background:var(--bg);font-weight:700;padding:3px 6px;white-space:nowrap;font-size:11px}

.list{display:flex;flex-direction:column}
.list .li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.list .li:last-child{border-bottom:0}
.list .li .grow{flex:1;min-width:0}
.me-hl{background:var(--accent-soft);border-radius:6px;padding:0 4px;font-weight:700}

.sheet-wrap{position:fixed;inset:0;z-index:20;background:rgba(10,14,26,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:85%;overflow:auto;border-radius:18px 18px 0 0;box-shadow:var(--shadow);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.empty{padding:24px 8px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
@media (prefers-reduced-motion: no-preference){.btn,.cell,.brush,.chip,.cand button{transition:background-color .15s,border-color .15s}}
@media (prefers-reduced-motion: reduce){.icon-btn.spin{animation:none;opacity:.5}}
/* 週間シフトの印刷（A4横1枚） */
/* 印刷用の週間シフト。パソコンは印刷のときだけ出す。スマホは PDF にするときだけ、画面の外に A4横（余白8mm）の大きさで出して写し取る */
#print{display:none;color:#000;background:#fff;font-family:var(--f-body)}
#print.pdf{display:block;position:fixed;left:0;top:0;z-index:-1;width:281mm;height:194mm;box-sizing:border-box}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
}
  #print .ph{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 2mm}
  #print h1{font-size:14pt;margin:0}
  #print .pm{font-size:9pt}
  #print table{width:100%;border-collapse:collapse;table-layout:fixed}
  #print th,#print td{border:.6pt solid #000;padding:.4mm 1mm;text-align:center;vertical-align:middle;line-height:1.1;overflow:hidden}
  #print th{background:#eee;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #print .nm{width:26mm;text-align:left;font-weight:700;white-space:nowrap}
  #print .from{display:block;font-size:.75em;font-weight:400}
  #print .tt{width:15mm}
  #print .sun{color:#c00} #print .sat{color:#00c}
  #print tr{height:var(--rh)}
  #print .ck{display:inline-block;width:1em;height:1em;border:.8pt solid #000;vertical-align:-.15em;margin-right:1mm;background:#fff}
  #print .t{font-weight:700} #print .r{font-size:.85em} #print .hp{font-style:italic} #print .nw{white-space:nowrap}
  #print tr.total td{background:#f3f3f3;font-weight:700;-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand" id="brand">シフト希望</div>
  <div class="monthsw">
    <button class="icon-btn" data-act="month" data-d="-1" aria-label="前の月">‹</button>
    <b id="monthLabel" class="num"></b>
    <button class="icon-btn" data-act="month" data-d="1" aria-label="次の月">›</button>
  </div>
  <button class="icon-btn" id="refreshBtn" data-act="refresh" aria-label="最新にする">↻</button>
</div></header>
<main id="view"><div class="empty">読み込み中…</div></main>
<nav class="tabs"><div class="tabs-in" id="tabs"></div></nav>
<div id="sheetWrap" class="sheet-wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<div id="print"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} },
  del(k){ try{ localStorage.removeItem(k); }catch{} }
};
const WD = '日月火水木金土';
// p＝勤務可能時間（何時〜何時）。o は以前の「出勤できる（終日）」の提出
const SYM = {o:'○', p:'○', x:'×'};
// 時刻は 0:00 からの分で持つ（540 = 9:00）
const DEFAULT_SETTINGS = { store:'', deadline:'', open:540, close:1260, bands:[{s:540, e:1260, n:2}], presets:['9:00-15:00', '15:00-21:00', '9:00-21:00'],
  roles:['レジ', '麺', '洗い場', '天ぷら', '玉取', '渡し', '高岡'] };
const API_URL = String(window.SHIFT_API_URL || '').trim();

const ym = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
const dk = i => String(i).padStart(2,'0');
function nextMonth(){ const d = new Date(); d.setDate(1); d.setMonth(d.getMonth()+1); return ym(d); }
function monthInfo(m){ const [y, mo] = m.split('-').map(Number); return { y, mo, n:new Date(y, mo, 0).getDate(), first:new Date(y, mo-1, 1).getDay() }; }
const dow = (m, i) => { const {y, mo} = monthInfo(m); return new Date(y, mo-1, i).getDay(); };
const dayLabel = (m, i) => `${monthInfo(m).mo}月${i}日(${WD[dow(m, i)]})`;
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const S = {
  mode:'loading', err:'', staff:{}, avail:{}, shifts:{}, settings:null,
  month:nextMonth(), tab:LS.get('sb.tab', 'req'), me:LS.get('sb.me', ''), key:LS.get('sb.key', ''),
  brush:'p', partA:LS.get('sb.partA', 540), partB:LS.get('sb.partB', 1260), lastAs:null, edit:null, draft:{days:{}, remark:''}, draftKey:'', dirty:false,
  isOwner:false, store:LS.get('sb.store', 'a'), selDay:null, wk:null, shiftMode:'week', showNg:false, confirmDel:null, needRender:false, sending:false
};
// 古い形式（早番・遅番）の設定にも、足りない項目は初期値を補う
const settings = () => ({...DEFAULT_SETTINGS, ...(S.settings || {})});
// 店舗：最初の店舗は 'a'。従業員・希望・シフトは店舗ごと、営業時間や持ち場は全店共通
const STORE_RE = /^[a-z0-9]{1,20}$/;
const stores = () => { const st = settings(); return st.stores?.length ? st.stores : [{id:'a', name:st.store || ''}]; };
const curStore = () => stores().find(x => x.id === S.store) || stores()[0];
const storeName = x => x.name || '店舗' + (stores().indexOf(x) + 1);
const shKey = (m, st = S.store) => st === 'a' ? m : m + '@' + st;
const stName = id => { const x = stores().find(s => s.id === id); return x ? storeName(x) : '他店'; };
const helpName = id => stName(id) + 'ヘルプ';
// 持ち場はいつも「昼の部｜夜の部」で出す（例：レジ｜天ぷら）。入っていない部と、持ち場が決まっていない部は「ー」。
// 昼だけの人は「レジ｜ー」、夜だけの人は「ー｜天ぷら」。夜の部の持ち場は、夜だけ違うとき r2、それ以外は r と同じ。夜を「なし」にしたときは r2 に「ー」を入れる
const splitAt = () => Number(settings().split ?? 1020);
const rolePair = v => `${v.s < splitAt() ? (v.r || 'ー') : 'ー'}｜${v.e > splitAt() ? (v.r2 || v.r || 'ー') : 'ー'}`;
const roleTxt = v => v.h ? helpName(v.h) : rolePair(v);
const staffList = () => Object.entries(S.staff).filter(([, v]) => v && v.active !== false && (v.store || 'a') === S.store)
  .map(([id, v]) => ({id, ...v})).sort((a, b) => (a.order||0) - (b.order||0));
const availDoc = (m, id) => S.avail[m + '_' + id];

/* ---------- 保存先：Googleスプレッドシート（Apps Script の受付窓口） ---------- */
let inflight = 0;
async function api(action, payload = {}){
  if(!API_URL) throw {code:'no_api'};
  inflight++;
  try{
    let r;
    // text/plain で送ると、ブラウザの事前確認（CORS）なしで Apps Script に届く
    try{ r = await fetch(API_URL, {method:'POST', body:JSON.stringify({action, key:S.key || '', ...payload})}); }
    catch{ throw {code:'offline'}; }
    let j; try{ j = await r.json(); }catch{ throw {code:'bad_response'}; }
    if(!j.ok) throw {code:j.error};
    return j.data;
  }finally{ inflight--; }
}
function saveErr(e){
  const c = e && e.code;
  if(c === 'offline') return '通信できません。電波の良いところでもう一度お試しください';
  if(c === 'forbidden') return '店長の合言葉が違うため保存できません';
  if(c === 'unknown_staff') return 'この名前は登録されていません。店長に確認してください';
  if(c === 'not_setup') return '受付窓口の準備（setup）がまだ終わっていません';
  if(c === 'no_api') return 'config.js に受付窓口のURLが書かれていません';
  return '保存できませんでした。もう一度お試しください';
}
const store = {
  set(path, d){
    const [c, id] = path.split('/');
    if(c === 'staff') return api('saveStaff', {id, data:d});
    if(c === 'settings') return api('saveSettings', {data:d});
    if(c === 'shifts') return api('saveShift', {month:id, data:d});
    return Promise.reject({code:'bad_path'});
  }
};
/* 同じドキュメントへの連続書き込みは1つにまとめ、順番に送る */
const pending = {};
function queueWrite(path, data, delay = 600){
  const p = pending[path] || (pending[path] = {});
  p.data = data; clearTimeout(p.timer); p.timer = setTimeout(() => flush(path), delay);
}
async function flush(path){
  const p = pending[path]; if(p.running){ p.again = true; return; }
  const data = p.data; p.data = null; if(!data) return;
  p.running = true;
  try{ await store.set(path, data); }catch(e){ toast(saveErr(e)); }
  p.running = false;
  if(p.again || p.data){ p.again = false; flush(path); }
}
const isPending = path => !!(pending[path] && (pending[path].data || pending[path].running));
const anyPending = () => Object.keys(pending).some(isPending);

/* ---------- 読み込み ---------- */
let loading = null;
function refresh(){
  if(loading) return loading;
  $('#refreshBtn').classList.add('spin');
  loading = (async () => {
    try{
      const d = await api('load', {staffId:S.me || '', store:S.store});
      if(S.key && !d.isOwner){ S.key = ''; LS.del('sb.key'); toast('店長の合言葉が違います。従業員用の画面で開きます'); }
      S.isOwner = !!d.isOwner;
      S.staff = d.staff || {};
      S.avail = d.avail || {};
      const sh = {...(d.shifts || {})};
      for(const m of Object.keys(S.shifts)) if(isPending('shifts/' + m)) sh[m] = S.shifts[m];
      S.shifts = sh;
      if(!isPending('settings/main')) S.settings = d.settings ? {...DEFAULT_SETTINGS, ...d.settings} : null;
      if(S.isOwner && !stores().some(x => x.id === S.store)){ S.store = stores()[0].id; LS.set('sb.store', S.store); }
      if(S.me && (!S.staff[S.me] || (S.staff[S.me].store || 'a') !== S.store)){ S.me = ''; LS.set('sb.me', ''); }
      S.mode = 'ready'; S.err = '';
    }catch(e){
      S.err = e && e.code === 'offline' ? '通信できません。表示は前回読み込んだ内容です' : saveErr(e);
      if(S.mode === 'loading') S.mode = 'error';
    }
    loading = null; $('#refreshBtn').classList.remove('spin'); render();
  })();
  return loading;
}

/* ---------- 下書き（自分の希望）：通信できなくても消えないよう端末にも残す ---------- */
const draftStoreKey = () => S.month + '_' + S.me;
function syncDraft(){
  const key = draftStoreKey();
  if(S.draftKey === key && S.dirty) return;
  S.draftKey = key;
  const saved = S.me ? LS.get('sb.drafts', {})[key] : null;
  if(saved){ S.draft = JSON.parse(JSON.stringify(saved)); S.dirty = true; return; }
  const doc = S.me ? availDoc(S.month, S.me) : null;
  S.dirty = false;
  S.draft = { days:JSON.parse(JSON.stringify(doc?.days || {})), remark:doc?.remark || '' };
}
function markDirty(){
  S.dirty = true;
  if(!S.me) return;
  const all = LS.get('sb.drafts', {}); all[draftStoreKey()] = S.draft; LS.set('sb.drafts', all);
}
function clearDraft(){ const all = LS.get('sb.drafts', {}); delete all[draftStoreKey()]; LS.set('sb.drafts', all); }

/* ---------- 時間（30分単位） ---------- */
const STEP = 30;
const fmt = m => `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`;
const fmtR = (s, e) => `${fmt(s)}-${fmt(e)}`;
const fmtH = h => (Number.isInteger(h) ? h : h.toFixed(1)) + '時間';
function parseRange(t){
  const m = String(t || '').replace(/：/g, ':').match(/(\d{1,2})(?::(\d{2}))?\s*時?\s*[-~〜～ー－]\s*(\d{1,2})(?::(\d{2}))?/);
  if(!m) return null;
  const s = m[1] * 60 + Number(m[2] || 0), e = m[3] * 60 + Number(m[4] || 0);
  return e > s ? {s, e} : null;
}
function hoursOf(){ const st = settings(), o = Number(st.open ?? 540), c = Number(st.close ?? 1260); return c > o ? {o, c} : {o:540, c:1260}; }
function ticks(){ const {o, c} = hoursOf(), a = []; for(let t = o; t < c; t += STEP) a.push(t); return a; }
function timeOpts(sel, from, to){ let h = ''; for(let t = from; t <= to; t += STEP) h += `<option value="${t}" ${t === sel ? 'selected' : ''}>${fmt(t)}</option>`; return h; }
// カレンダーの小さいマス用（9:00-21:00 → 9-21、9:30-15:00 → 9:30-15）
const shortR = (a, b) => [a, b].map(t => t % 60 ? fmt(t) : String(t / 60)).join('-');
const presets = () => (settings().presets || []).map(parseRange).filter(Boolean);
const roles = () => settings().roles || [];
// 必要な休憩（分）：8時間以上は60分、6時間を超えたら45分
// 6時間ちょうどの人は、少しでも延びると6時間を超えるので15分の休憩を書いておく
const breakMin = (s, e) => e - s >= 480 ? 60 : e - s > 360 ? 45 : e - s === 360 ? 15 : 0;
const brkTxt = (s, e) => breakMin(s, e) ? `休${breakMin(s, e)}` : '';
// 希望から、その日に入れる時間帯を出す（以前の○は開店〜閉店、時間の読めないものは null）
function availRange(e){
  if(!e || e.s === 'x') return null;
  const {o, c} = hoursOf();
  if(e.s === 'o') return {s:o, e:c};
  if(e.a != null && e.b > e.a) return {s:e.a, e:e.b};
  return parseRange(e.t);
}

/* ---------- シフト：days[日][従業員ID] = {s:開始, e:終了, r:持ち場} ---------- */
function getShift(m, st = S.store){ return S.shifts[shKey(m, st)] || { month:m, days:{}, published:false }; }
function editShift(m, fn, st = S.store){
  const s = JSON.parse(JSON.stringify(getShift(m, st)));
  s.days = s.days || {};
  fn(s); s.updatedAt = Date.now();
  S.shifts[shKey(m, st)] = s; queueWrite('shifts/' + shKey(m, st), s); render();
}
const needAt = t => (settings().bands || []).reduce((a, b) => t >= b.s && t < b.e ? Math.max(a, Number(b.n) || 0) : a, 0);
function dayNeed(){ return ticks().reduce((a, t) => Math.max(a, needAt(t)), 0); }
// ヘルプ（h:行き先の店舗）は元の店のシフトに保存し、行き先の店の人数に数える
function helpIn(m, d){
  const out = [];
  Object.entries(S.shifts).forEach(([k, sh]) => {
    const [km, src = 'a'] = k.split('@');
    if(km !== m || src === S.store) return;
    Object.entries(sh.days?.[d] || {}).forEach(([id, v]) => { if(v && v.h === S.store && v.e > v.s && S.staff[id] && S.staff[id].active !== false) out.push([id, v, src]); });
  });
  return out;
}
const dayEntries = (sh, d) => [...Object.entries(sh.days?.[d] || {}).filter(([id, v]) => S.staff[id] && S.staff[id].active !== false && v && v.e > v.s && !v.h), ...helpIn(sh.month, d)];
const asInner = (as, lab) => { const bk = brkTxt(as.s, as.e); return `<span class="t">${shortR(as.s, as.e)}</span>${lab || bk ? `<span class="r">${esc(lab || '')}${bk ? ` <span class="bk">${bk}</span>` : ''}</span>` : ''}`; };
function coverage(sh, d){ const es = dayEntries(sh, d); return ticks().map(t => ({t, n:es.filter(([, v]) => v.s <= t && t < v.e).length, need:needAt(t)})); }
function dayStatus(sh, d){
  const cov = coverage(sh, d);
  if(!dayEntries(sh, d).length) return cov.some(c => c.need) ? 'short' : '';
  return cov.every(c => c.n >= c.need) ? 'full' : 'half';
}
function staffTotals(sh, id){
  let days = 0, min = 0;
  Object.values(sh.days || {}).forEach(day => { const v = day[id]; if(v && v.e > v.s){ days++; min += v.e - v.s; } });
  return {days, hours:min / 60};
}

function dayStats(m, d){
  const r = {o:[], p:[], x:[], n:[]};
  for(const st of staffList()){
    const e = availDoc(m, st.id)?.days?.[d];
    if(!e) r.n.push({st}); else r[SYM[e.s] ? e.s : 'n'].push({st, t:e.t});
  }
  return r;
}

/* ---------- 描画 ---------- */
function isTyping(){ const a = document.activeElement; return a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#view').contains(a); }
function render(){
  if(isTyping()){ S.needRender = true; return; }
  S.needRender = false;
  const {y, mo} = monthInfo(S.month);
  $('#monthLabel').textContent = `${y}年${mo}月`;
  $('#brand').textContent = curStore().name || 'シフト希望';
  const tabs = S.isOwner
    ? [['req','○','希望提出'], ['sum','∑','集計'], ['shift','▦','シフト作成'], ['set','⚙','設定']]
    : [['req','○','希望提出'], ['my','▦','シフト']];
  if(!tabs.some(t => t[0] === S.tab)) S.tab = 'req';
  $('#tabs').innerHTML = tabs.map(([k, g, l]) => `<button class="tab" data-act="tab" data-t="${k}" ${S.tab === k ? 'aria-current="page"' : ''}><span class="g">${g}</span>${l}</button>`).join('');
  if(S.mode === 'loading'){ $('#view').innerHTML = '<div class="empty">読み込み中…</div>'; return; }
  if(S.mode === 'error'){
    $('#view').innerHTML = `<section class="card"><div class="empty"><h2>読み込めませんでした</h2><p>${esc(S.err)}</p><button class="btn primary" data-act="refresh">もう一度読み込む</button></div></section>`;
    return;
  }
  const v = { req:viewReq, sum:viewSum, shift:viewShift, set:viewSet, my:viewMy }[S.tab]();
  const banner = S.err ? `<div class="banner"><span>${esc(S.err)}</span><button class="btn small" data-act="refresh">再読み込み</button></div>` : '';
  // 店長には店舗の切り替えボタンを出す（2店舗以上のとき）
  const ss = stores();
  const bar = S.isOwner && ss.length > 1 ? `<div class="storebar" role="group" aria-label="店舗">${ss.map(x => `<button class="chip ${x.id === S.store ? 'on' : ''}" data-act="store" data-id="${esc(x.id)}" aria-pressed="${x.id === S.store}">${esc(storeName(x))}</button>`).join('')}</div>` : '';
  $('#view').innerHTML = banner + bar + v;
}

function calGrid(m, cellFn){
  const {n, first} = monthInfo(m);
  let h = '<div class="cal">' + [...WD].map((w, i) => `<div class="wd ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</div>`).join('');
  for(let i = 0; i < first; i++) h += '<div class="blank"></div>';
  for(let i = 1; i <= n; i++){ const w = dow(m, i); h += cellFn(i, dk(i), w === 0 ? 'sun' : w === 6 ? 'sat' : ''); }
  return h + '</div>';
}

function viewReq(){
  syncDraft();
  const staff = staffList();
  if(!staff.length) return `<section class="card"><div class="empty"><h2>まだ従業員が登録されていません</h2>
    ${S.isOwner ? '<p>「設定」で従業員の名前を追加すると、ここで名前を選んで希望を出せるようになります。</p><button class="btn primary" data-act="tab" data-t="set">設定を開く</button>' : '<p>店長が名前を登録するまでお待ちください。</p>'}</div></section>`;
  const doc = S.me ? availDoc(S.month, S.me) : null;
  const st = settings();
  const status = doc
    ? `<span class="pill ok">提出済み ${new Date(doc.submittedAt).toLocaleString('ja-JP', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'})}</span>`
    : (S.me ? '<span class="pill short">未提出</span>' : '');
  const who = `<div class="field"><label for="meSel">あなたの名前</label>
    <select id="meSel"><option value="">— 選んでください —</option>${staff.map(s => `<option value="${esc(s.id)}" ${s.id === S.me ? 'selected' : ''}>${esc(s.name)}</option>`).join('')}</select></div>`;
  const head = `<section class="card">
    <div class="row between"><h2>${monthInfo(S.month).mo}月の勤務できる日</h2>${status}</div>
    ${st.deadline ? `<p class="muted">提出締切：${esc(st.deadline)}</p>` : ''}
    ${who}
  </section>`;
  if(!S.me) return head;
  const brushes = [['p','○','勤務可能時間'], ['x','×','出勤できない'], ['c','消','消す']]
    .map(([k, s, l]) => `<button class="brush" data-act="brush" data-b="${k}" aria-pressed="${S.brush === k}"><span class="sym s-${k}">${s}</span>${l}</button>`).join('');
  const cal = calGrid(S.month, (i, d, wcls) => {
    const e = S.draft.days[d];
    return `<button class="cell ${wcls} ${e ? e.s : ''}" data-act="paint" data-day="${d}" aria-label="${dayLabel(S.month, i)} ${e ? SYM[e.s] : '未入力'}">
      <span class="dn">${i}</span><span class="big sym s-${e?.s || ''}">${e ? SYM[e.s] : ''}</span>${e?.t ? `<span class="tiny">${esc(e.b > e.a ? shortR(e.a, e.b) : e.t)}</span>` : ''}</button>`;
  });
  const cnt = {o:0, p:0, x:0}; Object.values(S.draft.days).forEach(e => cnt[e.s]++);
  const {n} = monthInfo(S.month);
  return head + `
  <section class="card">
    <div class="brushes">${brushes}</div>
    ${S.brush === 'p' ? (() => { const {o, c} = hoursOf(); return `<div class="row" style="flex-wrap:nowrap">
      <div class="field" style="flex:1"><label for="partA">何時から</label><select id="partA">${timeOpts(S.partA, o, c - STEP)}</select></div>
      <span class="tilde">〜</span>
      <div class="field" style="flex:1"><label for="partB">何時まで</label><select id="partB">${timeOpts(S.partB, o + STEP, c)}</select></div></div>`; })() : ''}
    <p class="muted">勤務できる時間を選んでから日付をタップ。同じものでもう一度タップすると消えます。</p>
    ${cal}
    <div class="row between">
      <span class="muted num"><span class="sym s-p">○</span>${cnt.o + cnt.p} <span class="sym s-x">×</span>${cnt.x}　未入力 ${n - cnt.o - cnt.p - cnt.x}</span>
    </div>
    <div class="row">
      <button class="btn small" data-act="fill">未入力を全部この時間に</button>
      <button class="btn small" data-act="weekend">土日を×</button>
      <button class="btn small" data-act="clearall">全部消す</button>
    </div>
  </section>
  <section class="card">
    <div class="field"><label for="remark">店長への連絡（任意）</label><textarea id="remark" placeholder="例）月8日くらいまで希望／テスト期間なので少なめで">${esc(S.draft.remark)}</textarea></div>
    ${S.dirty ? '<p class="muted">まだ提出していない変更があります（この端末には保存されています）。</p>' : ''}
    <button class="btn primary block" data-act="submit" ${S.sending ? 'disabled' : ''}>${S.sending ? '送信中…' : doc ? '内容を更新して提出' : 'この内容で提出'}</button>
  </section>`;
}

function viewSum(){
  const m = S.month, staff = staffList(), sh = getShift(m);
  if(!staff.length) return emptyStaff();
  const submitted = staff.filter(s => availDoc(m, s.id));
  const missing = staff.filter(s => !availDoc(m, s.id));
  const cal = calGrid(m, (i, d, wcls) => {
    const r = dayStats(m, d), can = r.o.length + r.p.length, need = dayNeed(sh, d);
    const cls = need ? (can >= need ? 'full' : 'short') : '';
    return `<button class="cell ${wcls} ${cls}" data-act="sumday" data-day="${d}" aria-label="${dayLabel(m, i)} 勤務可能${can}人">
      <span class="dn">${i}</span><span class="big num">${can}</span><span class="tiny">○${r.o.length + r.p.length} ×${r.x.length}</span></button>`;
  });
  const {n} = monthInfo(m);
  let head = '<tr><th>名前</th>', body = '', tot = '<tr class="total"><td>可能人数</td>';
  for(let i = 1; i <= n; i++){ const w = dow(m, i); head += `<th class="${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${i}<br>${WD[w]}</th>`; }
  for(const s of staff){
    const doc = availDoc(m, s.id);
    body += `<tr><td>${esc(s.name)}</td>`;
    for(let i = 1; i <= n; i++){ const e = doc?.days?.[dk(i)]; body += `<td>${e ? `<span class="sym s-${e.s}">${SYM[e.s]}</span>` : (doc ? '' : '<span class="muted">·</span>')}</td>`; }
    body += '</tr>';
  }
  for(let i = 1; i <= n; i++){ const r = dayStats(m, dk(i)); tot += `<td>${r.o.length + r.p.length}</td>`; }
  const remarks = submitted.filter(s => availDoc(m, s.id).remark);
  return `
  <section class="card">
    <div class="row between"><h2>提出状況</h2><span class="pill ${missing.length ? 'short' : 'ok'} num">${submitted.length} / ${staff.length}人</span></div>
    ${missing.length ? `<div><h3>未提出</h3><div class="chips" style="margin-top:6px">${missing.map(s => `<span class="chip">${esc(s.name)}</span>`).join('')}</div></div>` : '<p class="muted">全員提出済みです。</p>'}
  </section>
  <section class="card">
    <h2>日ごとの勤務可能人数</h2>
    <div class="legend"><span><i style="background:var(--ok-soft)"></i>必要人数を満たす</span><span><i style="background:var(--ng-soft)"></i>必要人数に足りない</span></div>
    ${cal}
    <p class="muted">日付をタップすると、誰が入れるかが見られます。必要人数はシフト作成・設定で変えられます。</p>
  </section>
  <section class="card">
    <h2>一覧表</h2>
    <div class="scroll"><table class="mx"><thead>${head}</tr></thead><tbody>${body}${tot}</tr></tbody></table></div>
  </section>
  ${remarks.length ? `<section class="card"><h2>連絡事項</h2><div class="list">${remarks.map(s => `<div class="li"><div class="grow"><b>${esc(s.name)}</b><p class="muted">${esc(availDoc(m, s.id).remark)}</p></div></div>`).join('')}</div></section>` : ''}`;
}

// 週は月曜はじまり。wk はその週の月曜の「日」（前の月にはみ出すと0以下）
const weekStartOf = (m, i) => i - (dow(m, i) + 6) % 7;
function weekDays(m, wk){
  const {y, mo, n} = monthInfo(m);
  return [...Array(7)].map((_, k) => {
    const i = wk + k, dt = new Date(y, mo - 1, i);
    return {i, d:dk(dt.getDate()), m:ym(dt), dn:dt.getDate(), mo:dt.getMonth() + 1, w:dt.getDay(), inM:i >= 1 && i <= n};
  });
}
const hShort = min => { const h = min / 60; return (Number.isInteger(h) ? h : h.toFixed(1)) + 'h'; };

function viewShift(){
  if(!staffList().length) return emptyStaff();
  return S.shiftMode === 'day' ? viewDay() : viewWeek();
}

// Excelのシフト表と同じ「名前×月〜日」の表
function viewWeek(){
  const m = S.month, staff = staffList(), sh = getShift(m), {n} = monthInfo(m);
  if(S.wk == null) S.wk = weekStartOf(m, Math.min(n, Number(S.selDay || 1)));
  const wd = weekDays(m, S.wk), first = wd[0], last = wd[6];
  const wcls = x => x.w === 0 ? 'sun' : x.w === 6 ? 'sat' : '';
  const head = wd.map(x => {
    const lab = `<span>${x.mo}/${x.dn}</span><span>${WD[x.w]}</span>`;
    if(!x.inM) return `<th class="${wcls(x)}"><div class="wh" style="opacity:.5">${lab}</div></th>`;
    return `<th class="${wcls(x)}"><button class="wh ${wcls(x)}" data-act="wday" data-day="${x.d}" aria-label="${dayLabel(m, x.i)}の時間ごとの人数">${lab}<span class="c ${dayStatus(sh, x.d)}">${dayEntries(sh, x.d).length}人</span></button></th>`;
  }).join('');
  const dayTot = wd.map(() => ({c:0, min:0}));
  const body = staff.map(st => {
    let cnt = 0, min = 0;
    const cells = wd.map((x, k) => {
      const v = (x.inM ? sh : getShift(x.m)).days?.[x.d]?.[st.id], as = v && v.e > v.s ? v : null;
      const e = availDoc(x.m, st.id)?.days?.[x.d], ar = availRange(e);
      if(as){ cnt++; min += as.e - as.s; if(!as.h){ dayTot[k].c++; dayTot[k].min += as.e - as.s; } }
      const warn = as && e && (!ar || ar.s > as.s || ar.e < as.e);
      const inner = as ? asInner(as, roleTxt(as))
        : e?.s === 'x' ? '<span class="t">×</span>'
        : e ? `<span class="t">${e.s === 'o' ? '終日' : ar ? shortR(ar.s, ar.e) : '○'}</span>` : '';
      const cls = (as ? 'as' + (warn ? ' warn' : '') + (as.h ? ' help' : '') : e?.s === 'x' ? 'x' : e ? 'av' : '') + (x.inM ? '' : ' out');
      return `<td class="${cls}">${x.inM
        ? `<button class="wc" data-act="editas" data-staff="${esc(st.id)}" data-day="${x.d}" aria-label="${esc(st.name)} ${dayLabel(m, x.i)}">${inner}</button>`
        : `<div class="wc">${inner}</div>`}</td>`;
    }).join('');
    return `<tr><td>${esc(st.name)}</td>${cells}<td class="tot">${cnt}日<br>${hShort(min)}</td></tr>`;
  }).join('');
  // 他店からのヘルプの人は、表の下に行を足す
  const helpers = new Map();
  wd.forEach((x, k) => helpIn(x.m, x.d).forEach(([id, v, src]) => { if(!helpers.has(id)) helpers.set(id, {src, v:[]}); helpers.get(id).v[k] = v; }));
  const helpRows = [...helpers].map(([id, {src, v}]) => {
    let cnt = 0, min = 0;
    const cells = wd.map((x, k) => {
      const as = v[k];
      if(as){ cnt++; min += as.e - as.s; dayTot[k].c++; dayTot[k].min += as.e - as.s; }
      const inner = as ? asInner(as, rolePair(as)) : '';
      return `<td class="${as ? 'as' : ''}${x.inM ? '' : ' out'}">${x.inM && as
        ? `<button class="wc" data-act="editas" data-staff="${esc(id)}" data-day="${x.d}" data-src="${esc(src)}" aria-label="${esc(S.staff[id].name)} ${dayLabel(m, x.i)}">${inner}</button>`
        : `<div class="wc">${inner}</div>`}</td>`;
    }).join('');
    return `<tr><td>${esc(S.staff[id].name)}<span class="from">${esc(stName(src))}から</span></td>${cells}<td class="tot">${cnt}日<br>${hShort(min)}</td></tr>`;
  }).join('');
  const tot = `<tr class="total"><td>合計</td>${dayTot.map(t => `<td>${t.c}人<br>${hShort(t.min)}</td>`).join('')}<td></td></tr>`;
  return `
  <section class="card">
    <div class="row between"><h2>シフト作成</h2>${sh.published ? '<span class="pill ok">公開中</span>' : '<span class="pill half">下書き</span>'}</div>
    <div class="row between" style="flex-wrap:nowrap">
      <button class="icon-btn" data-act="wstep" data-d="-1" aria-label="前の週">‹</button>
      <b class="num">${first.mo}/${first.dn}(月)〜${last.mo}/${last.dn}(日)</b>
      <button class="icon-btn" data-act="wstep" data-d="1" aria-label="次の週">›</button>
    </div>
    <p class="muted">マスをタップして時間と持ち場を入れます。曜日をタップすると、その日の時間ごとの人数が見られます。</p>
    <div>${isPhone() ? '<button class="btn" data-act="pdf">この週をPDFにする（A4横・印刷用）</button>' : '<button class="btn" data-act="print">この週を印刷（A4横）</button>'}</div>
    <div class="legend"><span><i style="background:var(--accent-soft)"></i>決めたシフト</span><span><i style="background:var(--ok-soft)"></i>勤務可能時間</span><span><i style="box-shadow:inset 0 0 0 2px var(--ng)"></i>希望の外</span></div>
    <div class="scroll"><table class="wk"><thead><tr><th>名前</th>${head}<th class="tot">週計</th></tr></thead><tbody>${body}${helpRows}${tot}</tbody></table></div>
  </section>
  ${shiftFooter(m, sh, staff)}`;
}

// 印刷用の週間シフト（決まったシフトだけ。人数が多いほど文字を小さくしてA4横1枚に収める）
function printWeek(){
  const m = S.month, wd = weekDays(m, S.wk), first = wd[0], last = wd[6];
  const wcls = x => x.w === 0 ? 'sun' : x.w === 6 ? 'sat' : '';
  const cell = (as, lab, help) => {
    if(!as) return '<td></td>';
    const bk = brkTxt(as.s, as.e);
    return `<td><span class="ck"></span><span class="t">${shortR(as.s, as.e)}</span>${lab || bk ? `<br><span class="r${help ? ' hp' : ''}">${esc(lab || '')}${bk ? ` <span class="nw">${bk}</span>` : ''}</span>` : ''}</td>`;
  };
  const dayTot = wd.map(() => 0);
  const rows = staffList().map(st => {
    let cnt = 0, min = 0;
    const tds = wd.map((x, k) => {
      const v = getShift(x.m).days?.[x.d]?.[st.id], as = v && v.e > v.s ? v : null;
      if(as){ cnt++; min += as.e - as.s; if(!as.h) dayTot[k]++; }
      return cell(as, as && roleTxt(as), as?.h);
    }).join('');
    return `<tr><td class="nm">${esc(st.name)}</td>${tds}<td>${cnt ? `${cnt}日 ${hShort(min)}` : ''}</td></tr>`;
  });
  const helpers = new Map();
  wd.forEach((x, k) => helpIn(x.m, x.d).forEach(([id, v, src]) => { if(!helpers.has(id)) helpers.set(id, {src, v:[]}); helpers.get(id).v[k] = v; }));
  helpers.forEach(({src, v}, id) => {
    let cnt = 0, min = 0;
    const tds = wd.map((x, k) => { const as = v[k]; if(as){ cnt++; min += as.e - as.s; dayTot[k]++; } return cell(as, as && rolePair(as)); }).join('');
    rows.push(`<tr><td class="nm">${esc(S.staff[id].name)}<span class="from">${esc(stName(src))}から</span></td>${tds}<td>${cnt}日 ${hShort(min)}</td></tr>`);
  });
  // 表に使える高さ約180mmを行数で割って、1行の高さを決める（ページの下まで使う）。
  // 1行は2段（時間・持ち場）なので、文字の大きさは行の高さに合わせる
  const rh = Math.min(26, 180 / (rows.length + 2));
  const fs = Math.max(6, Math.min(11, Math.floor((rh - 1) / 0.78 * 2) / 2));
  return `<div class="ph"><h1>${esc(storeName(curStore()))}　週間シフト　${first.mo}/${first.dn}(月)〜${last.mo}/${last.dn}(日)</h1><span class="pm"><span class="ck"></span>体調チェック：出勤したら、体調が大丈夫なら☑　${new Date().toLocaleDateString('ja-JP')} 作成</span></div>
    <table style="font-size:${fs}pt;--rh:${rh.toFixed(2)}mm"><thead><tr><th class="nm">名前</th>${wd.map(x => `<th class="${wcls(x)}">${x.mo}/${x.dn}(${WD[x.w]})</th>`).join('')}<th class="tt">週計</th></tr></thead>
    <tbody>${rows.join('')}<tr class="total"><td class="nm">人数</td>${dayTot.map(c => `<td>${c}人</td>`).join('')}<td></td></tr></tbody></table>`;
}

// スマホの印刷は「A4横」の指定が効かず縦に縮んで印刷されるので、A4横のPDFを作って渡す（PDFならスマホでも横向きのまま印刷できる）
const isPhone = () => /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const loadScript = src => new Promise((ok, ng) => { if(document.querySelector(`script[src="${src}"]`)) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => ng(new Error('load')); document.head.appendChild(s); });
async function makePdf(){
  if(S.sending) return;
  S.sending = true; toast('PDFを作っています…');
  const box = $('#print');
  try{
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    box.innerHTML = printWeek(); box.classList.add('pdf');
    const cv = await html2canvas(box, {scale:3, backgroundColor:'#fff', windowWidth:1200, logging:false});
    const pdf = new jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 8, 8, 281, 194);
    const wd = weekDays(S.month, S.wk);
    const name = `週間シフト_${storeName(curStore())}_${wd[0].mo}月${wd[0].dn}日.pdf`;
    S.pdf = new File([pdf.output('blob')], name, {type:'application/pdf'});
    // 共有は画面をタップした直後でないと動かないので、できあがったらもう一度押してもらう
    openSheet(`<h2>PDFができました</h2><p class="muted">「共有・印刷」を押して、出てきたメニューの「プリント」を選んでください。A4横のまま印刷されます。</p>
      <button class="btn primary block" data-act="pdfshare">共有・印刷</button>`);
  }catch(e){ toast(e.message === 'load' ? 'PDFを作れませんでした。電波の良いところでもう一度押してください' : 'PDFを作れませんでした'); }
  box.classList.remove('pdf'); S.sending = false;
}
async function sharePdf(){
  const f = S.pdf;
  if(!f) return;
  if(navigator.canShare?.({files:[f]})){ try{ await navigator.share({files:[f]}); }catch{} return; }
  const url = URL.createObjectURL(f), a = document.createElement('a');
  a.href = url; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}

function shiftFooter(m, sh, staff){
  const tally = staff.map(s => {
    const doc = availDoc(m, s.id), t = staffTotals(sh, s.id);
    const can = doc ? Object.values(doc.days || {}).filter(e => e.s !== 'x').length : null;
    return `<div class="li"><div class="grow">${esc(s.name)}</div><span class="muted num">${can == null ? '未提出' : `入れる日 ${can}日`}</span><b class="num" style="min-width:6.5em;text-align:right">${t.days}日 ${fmtH(t.hours)}</b></div>`;
  }).join('');
  return `
  <section class="card">
    <h2>今月の勤務日数と時間</h2>
    <div class="list">${tally}</div>
  </section>
  <section class="card">
    <h2>公開と書き出し</h2>
    <p class="muted">公開すると、従業員の「シフト」画面に表示されます。</p>
    <div class="row">
      <button class="btn ${sh.published ? '' : 'primary'}" data-act="publish">${sh.published ? '公開をやめる' : '従業員に公開する'}</button>
      <button class="btn" data-act="csv">CSVで保存</button>
    </div>
  </section>`;
}

// 1日の画面：時間ごとの人数と、足りない時間
function viewDay(){
  const m = S.month, staff = staffList(), sh = getShift(m);
  const {n} = monthInfo(m);
  if(!S.selDay || Number(S.selDay) > n) S.selDay = '01';
  const d = S.selDay, di = Number(d), tk = ticks(), N = tk.length;
  const cal = calGrid(m, (i, dd, wcls) => {
    const c = dayEntries(sh, dd).length;
    return `<button class="cell ${wcls} ${dayStatus(sh, dd)} ${dd === d ? 'sel' : ''}" data-act="selday" data-day="${dd}" aria-label="${dayLabel(m, i)} ${c}人">
      <span class="dn">${i}</span><span class="big num" style="font-size:16px">${c}<span class="tiny">人</span></span></button>`;
  });
  const cov = coverage(sh, d);
  const head = `<div class="tl tl-head" style="--n:${N}">${tk.map(t => `<span>${t % 60 === 0 ? t / 60 : ''}</span>`).join('')}</div>`;
  const covRow = `<div class="tl tl-cov" style="--n:${N}">${cov.map(c => `<span class="${c.need ? (c.n >= c.need ? 'ok' : 'ng') : ''}">${c.n}</span>`).join('')}</div>`;
  // 足りない時間帯を「9:00-11:00 あと1人」のようにまとめる
  const gaps = [];
  cov.forEach(c => { const lack = c.need - c.n; if(lack <= 0) return; const g = gaps[gaps.length - 1]; if(g && g.e === c.t && g.lack === lack) g.e = c.t + STEP; else gaps.push({s:c.t, e:c.t + STEP, lack}); });
  const r = dayStats(m, d);
  const order = [...r.o.map(x => ({...x, s:'o'})), ...r.p.map(x => ({...x, s:'p'})), ...r.n.map(x => ({...x, s:''})), ...r.x.map(x => ({...x, s:'x'}))];
  const today = sh.days?.[d] || {};
  const rows = order.filter(({st, s}) => s !== 'x' || S.showNg || today[st.id]?.e).map(({st:s, s:code}) => {
    const e = availDoc(m, s.id)?.days?.[d], ar = availRange(e), v = today[s.id], as = v && v.e > v.s ? v : null;
    const cells = tk.map(t => {
      const inA = as && !as.h && as.s <= t && t < as.e, inV = ar && ar.s <= t && t < ar.e;
      return `<span class="${inA ? (inV || !code ? 'as' : 'as warn') : inV ? 'av' : ''}"></span>`;
    }).join('');
    const want = code === 'p' ? `○ ${e?.t || '時間の指定なし'}` : code === 'o' ? '○ 終日' : code === 'x' ? '× 出勤できない' : '未回答';
    const bk = as ? brkTxt(as.s, as.e) : '';
    const tm = as ? fmtR(as.s, as.e) + (roleTxt(as) ? ' ' + esc(roleTxt(as)) : '') + (bk ? ` <span class="muted">${bk}</span>` : '') : '未割当';
    return `<button class="srow ${as ? 'on' : ''} ${code === 'x' && !as ? 'dim' : ''}" data-act="editas" data-staff="${esc(s.id)}">
      <span class="srow-top"><span class="nm"><span class="sym s-${code}">${code ? SYM[code] : '—'}</span> ${esc(s.name)}</span><span class="tm num">${tm}</span></span>
      <span class="tl" style="--n:${N}">${cells}</span>
      <span class="meta">${esc(want)}・今月${staffTotals(sh, s.id).days}日</span></button>`;
  }).join('') + helpIn(m, d).map(([id, v, src]) => {
    const cells = tk.map(t => `<span class="${v.s <= t && t < v.e ? 'as' : ''}"></span>`).join('');
    const bk = brkTxt(v.s, v.e);
    return `<button class="srow on" data-act="editas" data-staff="${esc(id)}" data-src="${esc(src)}">
      <span class="srow-top"><span class="nm">${esc(S.staff[id].name)}</span><span class="tm num">${fmtR(v.s, v.e)}${rolePair(v) ? ' ' + esc(rolePair(v)) : ''}${bk ? ` <span class="muted">${bk}</span>` : ''}</span></span>
      <span class="tl" style="--n:${N}">${cells}</span>
      <span class="meta">${esc(stName(src))}からヘルプ</span></button>`;
  }).join('');
  return `
  <div><button class="btn small" data-act="wback">‹ 週の表に戻る</button></div>
  <section class="card">
    <div class="row between">
      <button class="icon-btn" data-act="dstep" data-d="-1" ${di <= 1 ? 'disabled' : ''} aria-label="前の日">‹</button>
      <h2>${dayLabel(m, di)}</h2>
      <button class="icon-btn" data-act="dstep" data-d="1" ${di >= n ? 'disabled' : ''} aria-label="次の日">›</button>
    </div>
    <div class="field"><h3>時間ごとの人数</h3>${head}${covRow}</div>
    ${gaps.length ? `<p class="muted" style="color:var(--ng)">足りない時間：${gaps.map(g => `${fmtR(g.s, g.e)} あと${g.lack}人`).join('、')}</p>` : (dayEntries(sh, d).length ? '<p class="muted" style="color:var(--ok)">必要人数を満たしています</p>' : '')}
    <p class="muted">名前をタップして、入る時間を決めます。<span style="color:var(--ok)">緑</span>は勤務可能時間、<span style="color:var(--accent)">青</span>が決めたシフトです。</p>
    <label class="row muted" style="font-size:13px"><input type="checkbox" id="showNg" ${S.showNg ? 'checked' : ''}> ×の人も表示する</label>
    <div class="slist">${rows || '<p class="muted">表示できる人がいません</p>'}</div>
  </section>
  <section class="card">
    <div class="row between"><h2>${monthInfo(m).mo}月</h2>${sh.published ? '<span class="pill ok">公開中</span>' : '<span class="pill half">下書き</span>'}</div>
    <div class="legend"><span><i style="background:var(--ok-soft)"></i>必要人数を満たす</span><span><i style="background:var(--part-soft)"></i>足りない時間あり</span><span><i style="background:var(--ng-soft)"></i>未割り当て</span></div>
    ${cal}
  </section>
  ${shiftFooter(m, sh, staff)}`;
}

const brkLine = (s, e) => e > s ? `勤務 ${fmtH((e - s) / 60)}・必要な休憩 ${breakMin(s, e) ? breakMin(s, e) + '分' : 'なし'}` : '終わりの時間を、始まりより後にしてください';
// src：シフトを保存している店（他店からのヘルプの人を開いたときは元の店）
function editAssignSheet(id, src = S.store){
  const m = S.month, d = S.selDay, sh = getShift(m, src), cur = sh.days?.[d]?.[id], has = cur && cur.e > cur.s, away = src !== S.store;
  const e = availDoc(m, id)?.days?.[d], ar = availRange(e), {o, c} = hoursOf();
  const def = has ? cur : (e?.s === 'p' && ar) || S.lastAs || {s:o, e:c};
  // 持ち場は、決まっていればそれ、なければこの人が今月最後に入った持ち場
  const r0 = has ? (cur.r || '') : (Object.keys(sh.days || {}).sort().reverse().map(k => sh.days[k][id]?.r).find(Boolean) || '');
  const h0 = has ? (cur.h || '') : '';
  const n0 = has ? (cur.r2 || '') : '';
  S.edit = {id, d, r:r0, h:h0, r2:n0, src};
  const chips = [...(e?.s === 'p' && ar ? [{label:'希望どおり ' + fmtR(ar.s, ar.e), ...ar}] : []), ...presets()]
    .map(p => `<button class="chip" data-act="preset" data-s="${p.s}" data-e="${p.e}">${esc(p.label || fmtR(p.s, p.e))}</button>`).join('');
  const rl = [...new Set(['', ...roles(), r0])];
  // 自分の店の人には、他店へのヘルプも持ち場と同じ並びで選べるようにする
  const hl = away ? [] : stores().filter(x => x.id !== S.store);
  const rchips = rl.map(x => `<button class="chip ${!h0 && x === r0 ? 'on' : ''}" data-act="role" data-r="${esc(x)}">${x ? esc(x) : 'なし'}</button>`).join('')
    + hl.map(x => `<button class="chip ${h0 === x.id ? 'on' : ''}" data-act="role" data-r="" data-h="${esc(x.id)}">${esc(helpName(x.id))}</button>`).join('');
  openSheet(`<h2>${esc(S.staff[id].name)}${away ? `（${esc(stName(src))}から）` : ''}　${dayLabel(m, Number(d))}</h2>
    <p class="muted">希望：${e ? (e.s === 'p' ? '○ ' + esc(e.t || '時間の指定なし') : e.s === 'o' ? '○ 終日' : '× 出勤できない') : '未回答'}</p>
    ${chips ? `<div class="chips">${chips}</div>` : ''}
    <div class="row" style="flex-wrap:nowrap">
      <div class="field" style="flex:1"><label for="asS">開始</label><select id="asS">${timeOpts(def.s, o, c - STEP)}</select></div>
      <span class="tilde">〜</span>
      <div class="field" style="flex:1"><label for="asE">終了</label><select id="asE">${timeOpts(def.e, o + STEP, c)}</select></div>

}

function viewMy(){
  const m = S.month, sh = getShift(m);
  if(!sh.published) return `<section class="card"><div class="empty"><h2>${monthInfo(m).mo}月のシフトはまだ公開されていません</h2><p>店長が公開するとここに表示されます。</p></div></section>`;
  const {n} = monthInfo(m);
  const mine = [];
  let rows = '';
  for(let i = 1; i <= n; i++){
    const d = dk(i), es = dayEntries(sh, d).sort((a, b) => a[1].s - b[1].s);
    const v = S.me && sh.days?.[d]?.[S.me];
    if(v && v.e > v.s) mine.push(`${i}日(${WD[dow(m, i)]}) ${fmtR(v.s, v.e)}${roleTxt(v) ? ' ' + roleTxt(v) : ''}`);
    if(!es.length) continue;
    const w = dow(m, i);
    rows += `<div class="li"><b class="num" style="min-width:4.2em;align-self:flex-start;color:${w === 0 ? 'var(--sun)' : w === 6 ? 'var(--sat)' : 'inherit'}">${i}日(${WD[w]})</b><div class="grow">${es.map(([id, v]) => `<div class="num">${id === S.me ? `<span class="me-hl">${esc(S.staff[id].name)}</span>` : esc(S.staff[id].name)}${(S.staff[id].store || 'a') !== S.store ? `<span class="muted">（${esc(stName(S.staff[id].store || 'a'))}）</span>` : ''} <span class="muted">${fmtR(v.s, v.e)}${rolePair(v) ? ' ' + esc(rolePair(v)) : ''}</span></div>`).join('')}</div></div>`;
  }
  const t = S.me ? staffTotals(sh, S.me) : null;
  return `
  <section class="card">
    <h2>あなたの勤務日</h2>
    ${S.me ? (mine.length ? `<div class="chips">${mine.map(x => `<span class="chip on num">${esc(x)}</span>`).join('')}</div><p class="muted num">合計 ${t.days}日・${fmtH(t.hours)}</p>` : '<p class="muted">今月の割り当てはありません。</p>') : '<p class="muted">「希望提出」で名前を選ぶと、自分の勤務日が表示されます。</p>'}
  </section>
  <section class="card"><h2>${monthInfo(m).mo}月のシフト</h2><div class="list">${rows || '<p class="muted">まだ割り当てがありません。</p>'}</div></section>`;
}

/* ---------- シート・トースト ---------- */
function openSheet(html){ $('#sheet').innerHTML = html + '<button class="btn block" data-act="close">閉じる</button>'; $('#sheetWrap').hidden = false; }
function closeSheet(){ $('#sheetWrap').hidden = true; }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2800); }

function sumDaySheet(d){
  const r = dayStats(S.month, d);
  const grp = (k, label, list) => `<div class="field"><h3><span class="sym s-${k}">${label}</span> ${list.length}人</h3><div class="chips">${list.map(x => `<span class="chip">${esc(x.st.name)}${x.t ? ` <span class="t">${esc(x.t)}</span>` : ''}</span>`).join('') || '<span class="muted">なし</span>'}</div></div>`;

    <button class="btn primary block" data-act="goshift" data-day="${d}">この日のシフトを作る</button>`);

/* ---------- 提出 ---------- */
async function submit(){
  if(!S.me){ toast('名前を選んでください'); return; }
  if(!Object.keys(S.draft.days).length){ toast('カレンダーに勤務可能時間か×を入力してください'); return; }
  if(S.sending) return;
  S.sending = true; render();
  try{
    const data = await api('submit', {month:S.month, staffId:S.me, days:S.draft.days, remark:S.draft.remark});
    S.avail[S.month + '_' + S.me] = data; clearDraft(); S.dirty = false; S.draftKey = '';
    toast('提出しました');
  }catch(e){ toast(saveErr(e)); }
  S.sending = false; render();
}

function exportCsv(){
  const m = S.month, sh = getShift(m), staff = staffList(), {n} = monthInfo(m);
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const help = new Map();
  for(let i = 1; i <= n; i++) helpIn(m, dk(i)).forEach(([id, v, src]) => { if(!help.has(id)) help.set(id, {src, days:{}}); help.get(id).days[dk(i)] = v; });
  const hp = [...help];
  const cell = (v, lab) => v && v.e > v.s ? fmtR(v.s, v.e) + (lab ? ' ' + lab : '') : '';
  const lines = [['日付', '曜日', ...staff.map(s => s.name), ...hp.map(([id, x]) => `${S.staff[id].name}（${stName(x.src)}）`)].map(q).join(',')];
  for(let i = 1; i <= n; i++){
    const day = sh.days?.[dk(i)] || {};
    lines.push([`${m}-${dk(i)}`, WD[dow(m, i)], ...staff.map(s => { const v = day[s.id]; return cell(v, v && roleTxt(v)); }), ...hp.map(([, x]) => cell(x.days[dk(i)], x.days[dk(i)] && rolePair(x.days[dk(i)])))].map(q).join(','));
  }
  lines.push(['合計', '', ...staff.map(s => { const t = staffTotals(sh, s.id); return `${t.days}日 ${fmtH(t.hours)}`; }),
    ...hp.map(([, x]) => { const vs = Object.values(x.days); return `${vs.length}日 ${fmtH(vs.reduce((a, v) => a + v.e - v.s, 0) / 60)}`; })].map(q).join(','));
  const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv'}));
  const a = document.createElement('a'); a.href = url; a.download = `シフト_${storeName(curStore())}_${m}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); toast('コピーしました'); }
  catch{ openSheet(`<h2>コピーしてください</h2><textarea readonly style="font-size:13px;min-height:90px">${esc(text)}</textarea>`); }
}

/* ---------- 操作 ---------- */
function confirmTwice(key){
  if(S.confirmDel === key) { S.confirmDel = null; return true; }
  S.confirmDel = key; render();
  setTimeout(() => { if(S.confirmDel === key){ S.confirmDel = null; render(); } }, 3000);
  return false;
}
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]');
  if(!b){ if(ev.target === $('#sheetWrap')) closeSheet(); return; }
  const a = b.dataset.act;
  if(a === 'month'){ const [y, mo] = S.month.split('-').map(Number); S.month = ym(new Date(y, mo - 1 + Number(b.dataset.d), 1)); S.selDay = null; S.wk = null; render(); window.scrollTo(0, 0); }
  else if(a === 'refresh'){ await refresh(); if(!S.err) toast('最新の内容にしました'); }
  else if(a === 'tab'){ S.tab = b.dataset.t; LS.set('sb.tab', S.tab); render(); window.scrollTo(0, 0); }
  else if(a === 'brush'){ S.brush = b.dataset.b; render(); }
  else if(a === 'paint'){
    const d = b.dataset.day, cur = S.draft.days[d];
    if(S.brush === 'p' && S.partB <= S.partA){ toast('終わりの時間を、始まりより後にしてください'); return; }
    const t = fmtR(S.partA, S.partB);
    if(S.brush === 'c' || (cur && cur.s === S.brush && (S.brush !== 'p' || cur.t === t))) delete S.draft.days[d];
    else S.draft.days[d] = S.brush === 'p' ? {s:'p', t, a:S.partA, b:S.partB} : {s:S.brush};
    markDirty(); render();
  }
  else if(a === 'fill'){
    if(S.partB <= S.partA){ toast('終わりの時間を、始まりより後にしてください'); return; }
    const {n} = monthInfo(S.month), t = fmtR(S.partA, S.partB);
    for(let i = 1; i <= n; i++) if(!S.draft.days[dk(i)]) S.draft.days[dk(i)] = {s:'p', t, a:S.partA, b:S.partB};
    markDirty(); render();
  }
  else if(a === 'weekend'){ const {n} = monthInfo(S.month); for(let i = 1; i <= n; i++){ const w = dow(S.month, i); if(w === 0 || w === 6) S.draft.days[dk(i)] = {s:'x'}; } markDirty(); render(); }
  else if(a === 'clearall'){ S.draft.days = {}; markDirty(); render(); }
  else if(a === 'submit') submit();
  else if(a === 'copy') copyText(b.dataset.text);
  else if(a === 'close') closeSheet();
  else if(a === 'sumday') sumDaySheet(b.dataset.day);
  else if(a === 'goshift'){ S.selDay = b.dataset.day; S.shiftMode = 'day'; S.tab = 'shift'; LS.set('sb.tab', S.tab); closeSheet(); render(); window.scrollTo(0, 0); }
  else if(a === 'selday'){ S.selDay = b.dataset.day; render(); }
  else if(a === 'dstep'){ const {n} = monthInfo(S.month); S.selDay = dk(Math.min(n, Math.max(1, Number(S.selDay) + Number(b.dataset.d)))); render(); }
  else if(a === 'wday'){ S.selDay = b.dataset.day; S.shiftMode = 'day'; render(); window.scrollTo(0, 0); }
  else if(a === 'wback'){ S.shiftMode = 'week'; S.wk = weekStartOf(S.month, Number(S.selDay || 1)); render(); window.scrollTo(0, 0); }
  else if(a === 'print'){ $('#print').innerHTML = printWeek(); window.print(); }
  else if(a === 'pdf') makePdf();
  else if(a === 'pdfshare') sharePdf();
  else if(a === 'wstep'){
    const {n} = monthInfo(S.month), [y, mo] = S.month.split('-').map(Number);
    let wk = (S.wk ?? 1) + 7 * Number(b.dataset.d);
    // 週がまるごと前（次）の月に入ったら、表示する月も切り替える
    if(wk + 6 < 1){ S.month = ym(new Date(y, mo - 2, 1)); wk += monthInfo(S.month).n; }
    else if(wk > n){ S.month = ym(new Date(y, mo, 1)); wk -= n; }
    S.wk = wk; S.selDay = dk(Math.min(monthInfo(S.month).n, Math.max(1, wk))); render();
  }
  else if(a === 'editas'){ if(b.dataset.day) S.selDay = b.dataset.day; editAssignSheet(b.dataset.staff, b.dataset.src || S.store); }
  else if(a === 'preset'){ $('#asS').value = b.dataset.s; $('#asE').value = b.dataset.e; $('#asBrk').textContent = brkLine(Number(b.dataset.s), Number(b.dataset.e)); }
  else if(a === 'role'){ if(S.edit){ S.edit.r = b.dataset.r; if(S.edit.src === S.store) S.edit.h = b.dataset.h || ''; } document.querySelectorAll('#asRoles .chip').forEach(c => c.classList.toggle('on', c === b)); }
  else if(a === 'role2'){ if(S.edit) S.edit.r2 = b.dataset.r; document.querySelectorAll('#asRoles2 .chip').forEach(c => c.classList.toggle('on', c === b)); }
  else if(a === 'saveas'){
    const s = Number($('#asS').value), e = Number($('#asE').value), {id, d} = S.edit || {};
    if(!id) return;
    if(e <= s){ toast('終わりの時間を、始まりより後にしてください'); return; }
    const {r, h, r2, src} = S.edit, v = {s, e};
    if(r) v.r = r;
    if(r2 && r2 !== r) v.r2 = r2;
    if(h) v.h = h;
    S.lastAs = {s, e}; closeSheet();
    editShift(S.month, sh => { (sh.days[d] = sh.days[d] || {})[id] = v; }, src);
  }
  else if(a === 'unassign'){
    const {id, d, src} = S.edit || {};
    if(!id) return;
    closeSheet();
    editShift(S.month, sh => { if(sh.days[d]){ delete sh.days[d][id]; if(!Object.keys(sh.days[d]).length) delete sh.days[d]; } }, src);
  }
  else if(a === 'publish'){ const p = !getShift(S.month).published; editShift(S.month, s => { s.published = p; }); toast(p ? '従業員に公開しました' : '公開をやめました'); }
  else if(a === 'csv') exportCsv();
  else if(a === 'addstaff'){
    const inp = $('#newStaff'); const names = (inp.value || '').split(/[、,\n]/).map(x => x.trim()).filter(Boolean);
    if(!names.length){ toast('名前を入力してください'); return; }
    inp.value = '';
    for(const [k, name] of names.entries()){
      const id = uid('s'), sd = {name:name.slice(0, 40), active:true, order:Date.now() + k, store:S.store};
      S.staff[id] = sd; render();
      try{ await store.set('staff/' + id, sd); }catch(e){ delete S.staff[id]; toast(saveErr(e)); break; }
    }
    render(); setTimeout(() => $('#newStaff')?.focus(), 0);
  }
  else if(a === 'delstaff'){
    const id = b.dataset.id;
    if(!confirmTwice(id)) return;
    const sd = {...S.staff[id], active:false}; S.staff[id] = sd; render();
    try{ await store.set('staff/' + id, sd); toast('削除しました'); }catch(e){ toast(saveErr(e)); }
    if(S.me === id){ S.me = ''; LS.set('sb.me', ''); }
    render();
  }
  else if(a === 'addband'){ const st = structuredClone(settings()), {o, c} = hoursOf(); (st.bands = st.bands || []).push({s:o, e:c, n:1}); saveSettings(st); }
  else if(a === 'delband'){
    const i = Number(b.dataset.i);
    if(!confirmTwice('band' + i)) return;
    const st = structuredClone(settings()); st.bands.splice(i, 1); saveSettings(st);
  }
  else if(a === 'store'){ switchStore(b.dataset.id); render(); window.scrollTo(0, 0); }
  else if(a === 'addstore'){
    const st = structuredClone(settings()), id = Math.random().toString(36).slice(2, 8);
    st.stores = [...stores(), {id, name:''}];
    switchStore(id); saveSettings(st);
    setTimeout(() => $(`[data-storename="${id}"]`)?.focus(), 0);
  }
  else if(a === 'delstore'){
    const id = b.dataset.id;
    if(Object.values(S.staff).some(v => v && v.active !== false && (v.store || 'a') === id)){ toast('この店舗には従業員がいます。先に従業員を削除してください'); return; }
    if(!confirmTwice('store' + id)) return;
    const st = structuredClone(settings()); st.stores = stores().filter(x => x.id !== id);
    if(S.store === id) switchStore(st.stores[0].id);
    saveSettings(st);
  }
  else if(a === 'logout'){
    if(!confirmTwice('logout')) return;
    S.key = ''; LS.del('sb.key'); S.isOwner = false; S.tab = 'req'; render(); refresh();
  }
});
function switchStore(id){
  S.store = id; LS.set('sb.store', id); S.wk = null; S.selDay = null; S.shiftMode = 'week';
  if(S.me && (S.staff[S.me]?.store || 'a') !== id){ S.me = ''; LS.set('sb.me', ''); }
  S.draftKey = ''; S.dirty = false;
}
function saveSettings(st){ S.settings = st; queueWrite('settings/main', st, 300); render(); }

document.addEventListener('change', ev => {
  const t = ev.target;
  if(t.id === 'meSel'){ S.me = t.value; LS.set('sb.me', S.me); S.draftKey = ''; S.dirty = false; t.blur(); render(); if(!S.isOwner) refresh(); }
  else if(t.id === 'showNg'){ S.showNg = t.checked; t.blur(); render(); }
  else if(t.dataset.set){ const st = structuredClone(settings()); st[t.dataset.set] = t.value.trim().slice(0, 60); S.settings = st; queueWrite('settings/main', st, 300); }
  else if(t.dataset.hours){
    const st = structuredClone(settings()); st[t.dataset.hours] = Number(t.value);
    if(st.close <= st.open){ toast('終わりの時間を、始まりより後にしてください'); render(); return; }
    t.blur(); saveSettings(st);
  }
  else if(t.dataset.band){
    const st = structuredClone(settings()), bd = st.bands?.[Number(t.dataset.i)]; if(!bd) return;
    bd[t.dataset.band] = t.dataset.band === 'n' ? Math.min(99, Math.max(0, parseInt(t.value, 10) || 0)) : Number(t.value);
    t.blur(); saveSettings(st);
  }
  else if(t.dataset.presets){
    const st = structuredClone(settings());
    st.presets = t.value.split(/[、,\s]+/).map(x => x.trim()).filter(x => parseRange(x)).slice(0, 20);
    saveSettings(st);
  }
  else if(t.dataset.storename){
    const st = structuredClone(settings()), id = t.dataset.storename, name = t.value.trim().slice(0, 40);
    st.stores = stores().map(x => x.id === id ? {...x, name} : x);
    // 最初の店舗の名前は、これまでの「店名」にも入れておく
    if(id === 'a') st.store = name;
    saveSettings(st);
  }
  else if(t.dataset.roles){
    const st = structuredClone(settings());
    st.roles = [...new Set(t.value.split(/[、,\s]+/).map(x => x.trim().slice(0, 20)).filter(Boolean))].slice(0, 20);
    saveSettings(st);
  }
  else if(t.id === 'asS' || t.id === 'asE') $('#asBrk').textContent = brkLine(Number($('#asS').value), Number($('#asE').value));
  else if(t.id === 'partA' || t.id === 'partB'){ S[t.id] = Number(t.value); LS.set('sb.' + t.id, S[t.id]); t.blur(); render(); }
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if(t.id === 'remark'){ S.draft.remark = t.value.slice(0, 500); markDirty(); }
});
document.addEventListener('focusout', () => setTimeout(() => { if(S.needRender) render(); }, 0));
document.addEventListener('keydown', ev => {
  if(ev.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if(ev.key === 'Enter' && ev.target.id === 'newStaff'){ ev.preventDefault(); document.querySelector('[data-act="addstaff"]').click(); }
});

/* ---------- 自動更新：アプリに戻ったときと、開いている間は1分ごと ---------- */
const quiet = () => !document.hidden && !isTyping() && !inflight && !anyPending() && $('#sheetWrap').hidden;
document.addEventListener('visibilitychange', () => { if(quiet()) refresh(); });
setInterval(() => { if(quiet()) refresh(); }, 60000);

/* ---------- 起動 ---------- */
(function boot(){
  const p = new URLSearchParams(location.search);
  // 従業員用URLの ?s= で店舗が決まる（最初の店舗は付かない）
  if(STORE_RE.test(p.get('s') || '')){ S.store = p.get('s'); LS.set('sb.store', S.store); }
  else if(!p.get('key') && !S.key){ S.store = 'a'; LS.set('sb.store', 'a'); }
  if(p.get('key')){
    S.key = p.get('key').trim(); LS.set('sb.key', S.key);
    history.replaceState(null, '', location.pathname + (p.get('s') ? '?s=' + encodeURIComponent(p.get('s')) : ''));
  }
  if(!API_URL){ S.mode = 'error'; S.err = saveErr({code:'no_api'}); render(); return; }
  render(); refresh();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
